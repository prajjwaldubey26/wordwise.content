spring.application.name=ai-content-detector
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ai_content_detector?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Prajjwal@12
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-please-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:3000,https://wordwise-content.vercel.app}}

# mock works fully offline. openai and anthropic fall back to mock if no key or an API request fails.
ai.provider=${AI_PROVIDER:mock}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-haiku-latest}

stripe.secret.key=${STRIPE_SECRET_KEY:}
app.frontend-url=${FRONTEND_URL:http://localhost:3000,https://wordwise-content.vercel.app,https://wordwise-content-oxgqosp8f-prajjwal6.vercel.app}
